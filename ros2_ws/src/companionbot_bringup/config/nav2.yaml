# CompanionBot navigation adaptation of linorobot2 jazzy + Nav2 1.3.12.
# Geometry is overwritten from nav2_geometry.json, verified against frozen MJCF.
# Original Ruckig / ReferenceBlock producer owns acceleration and jerk limits.
amcl:
  ros__parameters:
    base_frame_id: base_footprint
    odom_frame_id: odom
    global_frame_id: map
    scan_topic: /companionbot/scan
    tf_broadcast: true
    transform_tolerance: 0.2
    robot_model_type: nav2_amcl::DifferentialMotionModel
    laser_model_type: likelihood_field
    laser_min_range: 0.05
    laser_max_range: 8.0
    laser_likelihood_max_dist: 2.0
    max_beams: 120
    min_particles: 500
    max_particles: 2000
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    pf_err: 0.05
    pf_z: 0.99
    z_hit: 0.8
    z_rand: 0.2
    sigma_hit: 0.1
    do_beamskip: false
    resample_interval: 1
    update_min_d: 0.05
    update_min_a: 0.05
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    set_initial_pose: false
    always_reset_initial_pose: true
    first_map_only: true
    save_pose_rate: -1.0
map_server:
  ros__parameters:
    frame_id: map
    topic_name: map
controller_server:
  ros__parameters:
    controller_frequency: 10.0
    costmap_update_timeout: 0.3
    enable_stamped_cmd_vel: true
    publish_zero_velocity: true
    odom_topic: /companionbot/odom
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.0
    progress_checker_plugins: [progress_checker]
    goal_checker_plugins: [goal_checker]
    controller_plugins: [FollowPath]
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.1
      movement_time_allowance: 15.0
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      # Physical delivery remains <=15cm after settling. Reserve margin for
      # map-cell quantization, localization and the original stopping chain.
      xy_goal_tolerance: 0.08
      yaw_goal_tolerance: 0.15
      stateful: true
    FollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      desired_linear_vel: 0.2
      lookahead_dist: 0.4
      min_lookahead_dist: 0.25
      max_lookahead_dist: 0.6
      lookahead_time: 1.5
      use_velocity_scaled_lookahead_dist: false
      rotate_to_heading_angular_vel: 0.35
      max_angular_accel: 0.6
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.6
      allow_reversing: false
      transform_tolerance: 0.2
      min_approach_linear_velocity: 0.03
      approach_velocity_scaling_dist: 0.6
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 2.0
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true
      cost_scaling_dist: 0.35
      cost_scaling_gain: 0.8
      inflation_cost_scaling_factor: 4.0
      regulated_linear_scaling_min_radius: 0.5
      regulated_linear_scaling_min_speed: 0.03
      use_fixed_curvature_lookahead: false
      max_robot_pose_search_dist: 4.0
      # Cancellation requests zero intent; original producer owns safe braking.
      use_cancel_deceleration: false
      stateful: true
local_costmap:
  local_costmap:
    ros__parameters:
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      robot_radius: 0.2
      footprint_padding: 0.0
      update_frequency: 10.0
      publish_frequency: 2.0
      transform_tolerance: 0.2
      initial_transform_timeout: 20.0
      plugins: [obstacle_layer, inflation_layer]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        observation_sources: scan
        scan:
          topic: /companionbot/scan
          data_type: LaserScan
          marking: true
          clearing: true
          inf_is_valid: true
          expected_update_rate: 0.35
          observation_persistence: 0.0
          # Physical TF projects measured rays; floor returns stay below 2 cm.
          min_obstacle_height: 0.02
          max_obstacle_height: 2.0
          obstacle_min_range: 0.05
          obstacle_max_range: 7.5
          raytrace_min_range: 0.05
          raytrace_max_range: 8.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.45
        cost_scaling_factor: 4.0
      always_send_full_costmap: true
global_costmap:
  global_costmap:
    ros__parameters:
      global_frame: map
      robot_base_frame: base_footprint
      resolution: 0.05
      robot_radius: 0.2
      footprint_padding: 0.0
      track_unknown_space: true
      update_frequency: 2.0
      publish_frequency: 1.0
      transform_tolerance: 0.2
      initial_transform_timeout: 20.0
      plugins: [static_layer, obstacle_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        observation_sources: scan
        scan:
          topic: /companionbot/scan
          data_type: LaserScan
          marking: true
          clearing: true
          inf_is_valid: true
          expected_update_rate: 0.35
          observation_persistence: 0.0
          min_obstacle_height: 0.02
          max_obstacle_height: 2.0
          obstacle_min_range: 0.05
          obstacle_max_range: 7.5
          raytrace_min_range: 0.05
          raytrace_max_range: 8.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.45
        cost_scaling_factor: 4.0
      always_send_full_costmap: true
planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0
    costmap_update_timeout: 1.0
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_smac_planner::SmacPlanner2D
      tolerance: 0.1
      downsample_costmap: false
      allow_unknown: false
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 2.0
      cost_travel_multiplier: 2.0
      use_final_approach_orientation: false
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10
bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /companionbot/odom
    transform_tolerance: 0.2
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators: [navigate_to_pose]
    navigate_to_pose:
      plugin: nav2_bt_navigator::NavigateToPoseNavigator
    error_code_names: [compute_path_error_code, follow_path_error_code]

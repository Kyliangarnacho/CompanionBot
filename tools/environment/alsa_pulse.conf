# Project-local ALSA bridge to the configured PulseAudio server (WSLg/Pi).
# No monitor/loopback input; physical endpoint identity is still unverified.
</usr/share/alsa/alsa.conf>
pcm.!default {
    type pulse
    hint {
        show on
        description "CompanionBot configured PulseAudio"
    }
}
ctl.!default { type pulse }
